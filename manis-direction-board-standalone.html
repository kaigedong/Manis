:root[data-theme=&quot;light&quot;] {

}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );

}

.table-responsive &gt; .table :is(th, td) {

}

.table :is(th, td):last-child {

}

  padding: 0 !important;
  border: 0 !important;

  background: transparent !important;

.tooltip {

  left: 0;

.btn:not(:disabled):hover {

}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)

  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:

}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(

  [aria-selected=&quot;true&quot;],

  background: var(--primary);

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);

.btn:focus-visible {

  (() =&gt; {
    const root = document.getElementById(&#x27;manis-direction-board&#x27;);
    const options = Array.from(root.querySelectorAll(&#x27;.direction-option&#x27;));
    const current = root.querySelector(&#x27;#manis-current-choice&#x27;);
    const confirm = root.querySelector(&#x27;.confirm-choice&#x27;);
    const browserResult = root.querySelector(&#x27;.browser-result&#x27;);
    let selected = &#x27;Signal Patch Bay&#x27;;

    function showBrowserResult(message) {
      browserResult.hidden = false;
      browserResult.textContent = message;
    }

    function selectChoice(name) {
      selected = name;
      options.forEach(option =&gt; option.setAttribute(&#x27;aria-pressed&#x27;, String(option.dataset.choice === name)));
      current.textContent = name;
      confirm.textContent = `采用 ${name}`;
    }

    options.forEach(option =&gt; option.addEventListener(&#x27;click&#x27;, () =&gt; selectChoice(option.dataset.choice)));

    confirm.addEventListener(&#x27;click&#x27;, async () =&gt; {
      if (window.openai &amp;&amp; window.openai.sendFollowUpMessage) {
        await window.openai.sendFollowUpMessage({
          title: &#x27;确认设计方向&#x27;,
          prompt: `我选择 ${selected}。请以这个方向继续完成 Manis 的设计系统、宽/中/窄响应式原型，并给出 GPUI 实现规范。`
        });
      } else {
        showBrowserResult(`已选择 ${selected}。请回到 Alacritty 回复：我选择 ${selected}`);
      }
    });

    root.querySelectorAll(&#x27;[data-reroll]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, async () =&gt; {
      const register = button.dataset.reroll === &#x27;safer&#x27; ? &#x27;更稳妥&#x27; : &#x27;更大胆&#x27;;
      if (window.openai &amp;&amp; window.openai.sendFollowUpMessage) {
        await window.openai.sendFollowUpMessage({
          title: `探索${register}的方向`,
          prompt: `这组方向还不对。请重新生成一组${register}的视觉方向，仍然必须适合现代跨平台 GPUI 桌面代理工具。`
        });
      } else {
        showBrowserResult(`请回到 Alacritty 回复：换一组${register}的方向`);
      }
    }));

    if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
  })();
