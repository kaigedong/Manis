<div id="manis-direction-board">

    #manis-direction-board {

    #manis-direction-board .direction-name {

    #manis-direction-board .patch-rail-dot {

    #manis-direction-board .patch-list {

    #manis-direction-board .patch-eyebrow,

    #manis-direction-board .patch-canvas {

      overflow: hidden;

    #manis-direction-board .patch-canvas-title { font-size: 13px; font-weight: 700; }
    #manis-direction-board .patch-canvas-sub { margin-top: 3px; font-size: 8px; color: #63716d; }

    #manis-direction-board .patch-route {

      left: 28px;
      right: 24px;
      top: 98px;
      height: 4px;
      border-radius: 999px;

    #manis-direction-board .patch-node {
      position: absolute;
      top: 84px;

      height: 32px;

    #manis-direction-board .patch-node.n1 { left: 25px; }

    #manis-direction-board .patch-node-label {

    #manis-direction-board .patch-node-label.l3 { right: 10px; }

    #manis-direction-board .patch-status {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 16px;
      padding: 8px 10px;
      border-radius: 9px;
      background: #ffffff;

      color: #42504c;
      box-shadow: 0 1px 1px rgba(20,35,33,.06);

    #manis-direction-board .metro-window {
      display: grid;
      grid-template-columns: 128px 1fr;
      background: #f7f8fa;
      color: #17212b;
      border: 1px solid #dfe3e8;

    #manis-direction-board .metro-side { padding: 14px 11px; border-right: 1px solid #dfe3e8; }

    #manis-direction-board .metro-title { font-size: 15px; font-weight: 750; margin: 3px 0 2px; }
    #manis-direction-board .metro-sub { font-size: 8px; color: #66717c; }
    #manis-direction-board .metro-line { position: absolute; left: 35px; top: 91px; bottom: 23px; width: 4px; background: #2563eb; border-radius: 4px; }
    #manis-direction-board .metro-stop { position: absolute; left: 26px; width: 22px; height: 22px; border-radius: 50%; background: #f7f8fa; border: 5px solid #2563eb; }
    #manis-direction-board .metro-stop.s1 { top: 80px; }
    #manis-direction-board .metro-stop.s2 { top: 123px; border-color: #14a38b; }
    #manis-direction-board .metro-stop.s3 { top: 166px; border-color: #e49a2f; }
    #manis-direction-board .metro-stop-text { position: absolute; left: 59px; font-size: 9px; }
    #manis-direction-board .metro-stop-text.t1 { top: 82px; }
    #manis-direction-board .metro-stop-text.t2 { top: 125px; }
    #manis-direction-board .metro-stop-text.t3 { top: 168px; }
    #manis-direction-board .metro-stop-text strong { display: block; }
    #manis-direction-board .metro-stop-text span { color: #71808d; font-size: 8px; }

    #manis-direction-board .scope-window {
      display: grid;
      grid-template-columns: 116px 1fr;
      background: #09100f;
      color: #bfead9;

    #manis-direction-board .scope-side { padding: 14px 10px; border-right: 1px solid #283734; background: #0d1513; }
    #manis-direction-board .scope-brand { font-family: ui-monospace, monospace; color: #4de59a; font-size: 12px; font-weight: 700; margin-bottom: 16px; }
    #manis-direction-board .scope-nav { padding: 7px; margin-bottom: 4px; font: 8px ui-monospace, monospace; color: #6e8c82; }
    #manis-direction-board .scope-nav.active { background: #163127; color: #65f2ad; }
    #manis-direction-board .scope-main { position: relative; padding: 14px; overflow: hidden; }
    #manis-direction-board .scope-title { font: 11px ui-monospace, monospace; color: #eef8f4; }
    #manis-direction-board .scope-readout { margin-top: 3px; font: 8px ui-monospace, monospace; color: #f2b24d; }
    #manis-direction-board .scope-grid {
      position: absolute;
      left: 14px;
      right: 14px;
      top: 55px;
      bottom: 38px;
      background-image: linear-gradient(rgba(83,115,105,.22) 1px, transparent 1px), linear-gradient(90deg, rgba(83,115,105,.22) 1px, transparent 1px);
      background-size: 24px 24px;
      border: 1px solid #29413a;
    }
    #manis-direction-board .scope-trace { position: absolute; inset: 0; width: 100%; height: 100%; }
    #manis-direction-board .scope-status { position: absolute; left: 14px; right: 14px; bottom: 12px; display: flex; justify-content: space-between; font: 8px ui-monospace, monospace; color: #7da095; }

    #manis-direction-board .fluent-window {
      display: grid;
      grid-template-columns: 138px 180px 1fr;
      background: #f6f6f6;
      color: #202020;
      border: 1px solid #dddddd;
    }
    #manis-direction-board .fluent-side { padding: 14px 10px; background: #efefef; border-right: 1px solid #dddddd; }
    #manis-direction-board .fluent-brand { font-size: 13px; font-weight: 700; margin-bottom: 15px; }
    #manis-direction-board .fluent-nav { padding: 7px 8px; margin-bottom: 3px; border-radius: 5px; font-size: 9px; }

    #manis-direction-board .fluent-list { padding: 14px 10px; background: #fafafa; border-right: 1px solid #e2e2e2; }
    #manis-direction-board .fluent-list-title { font-size: 13px; font-weight: 650; margin: 4px 0 10px; }
    #manis-direction-board .fluent-row { padding: 8px; margin-bottom: 4px; border-radius: 5px; font-size: 9px; }
    #manis-direction-board .fluent-row.active { background: #e7f2fb; }

    #manis-direction-board .fluent-main { padding: 16px; }
    #manis-direction-board .fluent-title { font-size: 15px; font-weight: 650; }
    #manis-direction-board .fluent-panel { margin-top: 14px; padding: 13px; border: 1px solid #e0e0e0; border-radius: 8px; background: #ffffff; }
    #manis-direction-board .fluent-panel strong { font-size: 10px; }
    #manis-direction-board .fluent-step { display: flex; align-items: center; gap: 7px; margin-top: 10px; font-size: 8px; color: #555; }
    #manis-direction-board .fluent-step::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #0f6cbd; }

    #manis-direction-board .decision-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 16px;
      padding: 14px 0 0;
    }

    #manis-direction-board .confirm-choice,
    #manis-direction-board .reroll-choice {
      min-height: 40px;
      padding: 9px 15px;
      border-radius: 10px;
      font: 600 13px/1.2 inherit;
      cursor: pointer;
    }

    #manis-direction-board .confirm-choice {
      border: 1px solid light-dark(#145b53, #79d7c6);
      background: light-dark(#176c62, #75d8c6);
      color: light-dark(#ffffff, #0c2822);
    }

    #manis-direction-board .reroll-group { display: flex; gap: 8px; flex-wrap: wrap; }

    #manis-direction-board .reroll-choice {
      border: 1px solid light-dark(#cbd5d1, #3e4b47);
      background: transparent;
      color: inherit;
    }

    #manis-direction-board .browser-result {
      margin: 10px 0 0;
      color: light-dark(#176c62, #75d8c6);
      font-size: 13px;
      font-weight: 500;
    }

    #manis-direction-board .declined-ideas {
      margin-top: 14px;
      border-top: 1px solid light-dark(#dde4e1, #303b37);
      color: light-dark(#53615d, #a9b6b2);
      font-size: 12px;

    #manis-direction-board .declined-ideas summary {
      cursor: pointer;
      padding: 12px 0 4px;
      font-weight: 650;
      color: light-dark(#35423e, #cbd5d1);
    }

    #manis-direction-board .declined-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 8px;
      padding: 8px 0 2px;

    #manis-direction-board .declined-item {
      padding: 9px 10px;
      border-radius: 9px;
      background: light-dark(#f1f4f2, #19211f);
      line-height: 1.45;
    }

    #manis-direction-board .declined-item strong { display: block; margin-bottom: 2px; color: light-dark(#28332f, #dbe4e1); }

    @media (max-width: 620px) {
      #manis-direction-board .direction-heading { align-items: start; flex-direction: column; }
      #manis-direction-board .direction-content { grid-template-columns: 1fr; }
      #manis-direction-board .direction-preview { border-right: 0; border-bottom: 1px solid light-dark(#e1e7e4, #303b37); }
      #manis-direction-board .mini-window { height: 210px; }
      #manis-direction-board .direction-copy { padding: 17px; }
      #manis-direction-board .decision-actions { align-items: stretch; flex-direction: column; }
      #manis-direction-board .confirm-choice { width: 100%; }
      #manis-direction-board .declined-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 430px) {
      #manis-direction-board .patch-window { grid-template-columns: 42px 110px 1fr; }
      #manis-direction-board .patch-list { padding-inline: 7px; }
      #manis-direction-board .metro-window { grid-template-columns: 98px 1fr; }
      #manis-direction-board .scope-window { grid-template-columns: 90px 1fr; }
      #manis-direction-board .fluent-window { grid-template-columns: 90px 118px 1fr; }
      #manis-direction-board .fluent-main { padding: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      #manis-direction-board .direction-option { transition: none; }
    }
  </style>

    <div>

    <p class="direction-count" aria-live="polite">当前：<strong id="manis-current-choice">Signal Patch Bay</strong></p>

<script>
  (() => {
    const root = document.getElementById('manis-direction-board');
    const options = Array.from(root.querySelectorAll('.direction-option'));
    const current = root.querySelector('#manis-current-choice');
    const confirm = root.querySelector('.confirm-choice');
    const browserResult = root.querySelector('.browser-result');
    let selected = 'Signal Patch Bay';

    function showBrowserResult(message) {
      browserResult.hidden = false;
      browserResult.textContent = message;
    }

    function selectChoice(name) {
      selected = name;
      options.forEach(option => option.setAttribute('aria-pressed', String(option.dataset.choice === name)));
      current.textContent = name;
      confirm.textContent = `采用 ${name}`;
    }

    options.forEach(option => option.addEventListener('click', () => selectChoice(option.dataset.choice)));

    confirm.addEventListener('click', async () => {
      if (window.openai && window.openai.sendFollowUpMessage) {
        await window.openai.sendFollowUpMessage({
          title: '确认设计方向',
          prompt: `我选择 ${selected}。请以这个方向继续完成 Manis 的设计系统、宽/中/窄响应式原型，并给出 GPUI 实现规范。`
        });
      } else {
        showBrowserResult(`已选择 ${selected}。请回到 Alacritty 回复：我选择 ${selected}`);
      }
    });

    root.querySelectorAll('[data-reroll]').forEach(button => button.addEventListener('click', async () => {
      const register = button.dataset.reroll === 'safer' ? '更稳妥' : '更大胆';
      if (window.openai && window.openai.sendFollowUpMessage) {
        await window.openai.sendFollowUpMessage({
          title: `探索${register}的方向`,
          prompt: `这组方向还不对。请重新生成一组${register}的视觉方向，仍然必须适合现代跨平台 GPUI 桌面代理工具。`
        });
      } else {
        showBrowserResult(`请回到 Alacritty 回复：换一组${register}的方向`);
      }
    }));

    if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
  })();
</script>
