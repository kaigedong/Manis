name: Bug report
description: Report a reproducible Manis problem using synthetic or redacted data.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: Do not paste subscription URLs, tokens, node credentials, or unredacted logs.
  - type: input
    id: version
    attributes:
      label: Manis version or commit
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic endpoints and redact private data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed subscription URLs, tokens, node credentials, and private addresses.
          required: true
