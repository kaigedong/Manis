name: Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "crates/manis-android/**"
      - "crates/manis-profile/**"
      - "crates/manis-core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "crates/manis-android/**"
      - "crates/manis-profile/**"
      - "crates/manis-core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  apk:
    name: Build arm64 debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable

      - name: Install Android SDK packages
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018"

      - name: Install Rust target
        run: rustup target add aarch64-linux-android

      - name: Install cargo-ndk
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-ndk

      - name: Build APK
        run: android/build-apk.sh arm64-v8a

      - name: Verify APK
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          aapt="${ANDROID_HOME}/build-tools/35.0.0/aapt"
          "$aapt" dump badging "$apk" | grep -E "^package:|^sdkVersion:|^targetSdkVersion:|^native-code:"
          unzip -l "$apk" | grep -E "lib/arm64-v8a/(libmanis_android|libmihomo)\.so"
          sha256sum "$apk"

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: manis-android-arm64-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
