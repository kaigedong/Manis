name: Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "*"
      - "!latest"

permissions:
  contents: read

concurrency:
  group: package-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'latest' || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MANIS_BUILD_COMMIT: ${{ github.sha }}
  MANIS_PACKAGE_VERSION: 0.1.${{ github.run_number }}

jobs:
  mihomo-seeds:
    name: Prepare verified Mihomo seeds
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch and verify release assets
        env:
          MANIS_GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p dist/mihomo-seeds

          MANIS_MIHOMO_OS=Linux MANIS_MIHOMO_ARCH=x86_64 \
            packaging/fetch-mihomo.sh dist/mihomo-seeds/mihomo-linux-x86_64 \
            > dist/mihomo-seeds/mihomo-linux-x86_64.version

          MANIS_MIHOMO_SKIP_VERSION_CHECK=1 \
            MANIS_MIHOMO_OS=Darwin MANIS_MIHOMO_ARCH=arm64 \
            packaging/fetch-mihomo.sh dist/mihomo-seeds/mihomo-darwin-arm64 \
            > dist/mihomo-seeds/mihomo-darwin-arm64.version

          MANIS_MIHOMO_SKIP_VERSION_CHECK=1 \
            MANIS_MIHOMO_OS=Darwin MANIS_MIHOMO_ARCH=x86_64 \
            packaging/fetch-mihomo.sh dist/mihomo-seeds/mihomo-darwin-x86_64 \
            > dist/mihomo-seeds/mihomo-darwin-x86_64.version
      - name: Upload verified Mihomo seeds
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mihomo-seeds
          path: dist/mihomo-seeds
          if-no-files-found: error
          retention-days: 1

  macos:
    name: macOS ${{ matrix.architecture }}
    needs: mihomo-seeds
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download verified Mihomo seeds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mihomo-seeds
          path: ${{ runner.temp }}/mihomo-seeds
      - name: Verify native Mihomo seed
        shell: bash
        run: |
          seed="$RUNNER_TEMP/mihomo-seeds/mihomo-darwin-${{ matrix.architecture }}"
          expected_version="$(< "$seed.version")"
          chmod 0755 "$seed"
          version_output="$("$seed" -v 2>&1)"
          [[ "$version_output" == *"$expected_version"* ]]
          echo "$version_output"
      - name: Resolve package version
        id: package
        shell: bash
        run: |
          version="$(packaging/package-version.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install Rust toolchain
        run: rustup show active-toolchain
      - name: Test macOS helper signatures and authorization boundaries
        run: bash packaging/macos/test-helper-security.sh
      - name: Restore Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-package-macos-${{ matrix.architecture }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            cargo-package-macos-${{ matrix.architecture }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml') }}-
            cargo-package-macos-${{ matrix.architecture }}-
      - name: Build unsigned application bundle
        env:
          MANIS_BUILD_VERSION: ${{ steps.package.outputs.version }}
          MANIS_BUNDLE_BUILD: ${{ github.run_number }}
          MANIS_BUNDLE_VERSION: ${{ steps.package.outputs.version }}
          MANIS_MIHOMO_BINARY: ${{ runner.temp }}/mihomo-seeds/mihomo-darwin-${{ matrix.architecture }}
        run: packaging/macos/build-app.sh
      - name: Save Cargo cache
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - name: Verify and archive bundle
        shell: bash
        run: |
          codesign --verify --deep --strict dist/macos/Manis.app
          binary_architecture="$(file dist/macos/Manis.app/Contents/MacOS/Manis)"
          echo "$binary_architecture"
          case "${{ matrix.architecture }}" in
            arm64) [[ "$binary_architecture" == *"arm64"* ]] ;;
            x86_64) [[ "$binary_architecture" == *"x86_64"* ]] ;;
          esac
          archive="dist/Manis-${{ steps.package.outputs.version }}-macos-${{ matrix.architecture }}-unsigned.zip"
          ditto -c -k --sequesterRsrc --keepParent dist/macos/Manis.app "$archive"
          archive_name="$(basename "$archive")"
          (cd dist && shasum -a 256 "$archive_name" > "$archive_name.sha256")
      - name: Upload macOS package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manis-macos-${{ matrix.architecture }}
          path: |
            dist/Manis-*-macos-${{ matrix.architecture }}-unsigned.zip
            dist/Manis-*-macos-${{ matrix.architecture }}-unsigned.zip.sha256
          if-no-files-found: error
          retention-days: 14

  archlinux-wayland:
    name: Arch Linux Wayland x86_64
    needs: mihomo-seeds
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: archlinux:base-devel@sha256:a26046b7363dad8e2614858f4313949ae9b05c9c5f31de343a54864b9e20806f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download verified Mihomo seeds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mihomo-seeds
          path: ${{ runner.temp }}/mihomo-seeds
      - name: Install build dependencies
        shell: bash
        run: |
          pacman -Syu --noconfirm --needed \
          alsa-lib clang cmake desktop-file-utils fontconfig git hicolor-icon-theme \
          libx11 libxcb libxkbcommon libxkbcommon-x11 mesa pkgconf polkit rustup \
          vulkan-headers vulkan-icd-loader wayland wayland-protocols
          useradd --create-home --shell /bin/bash builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Resolve package version
        id: package
        shell: bash
        run: |
          version="$(runuser -u builder -- env \
            MANIS_PACKAGE_VERSION="$MANIS_PACKAGE_VERSION" \
            "$GITHUB_WORKSPACE/packaging/package-version.sh")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          runuser -u builder -- bash -c 'cd "$1" && rustup show active-toolchain' _ "$GITHUB_WORKSPACE"
      - name: Restore Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /home/builder/.cargo/registry/index/
            /home/builder/.cargo/registry/cache/
            /home/builder/.cargo/git/db/
            target/archlinux/
          key: cargo-package-archlinux-x86_64-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            cargo-package-archlinux-x86_64-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml') }}-
            cargo-package-archlinux-x86_64-
      - name: Prepare Cargo cache ownership
        shell: bash
        run: |
          mkdir -p /home/builder/.cargo "$GITHUB_WORKSPACE/target/archlinux"
          chown -R builder:builder /home/builder/.cargo "$GITHUB_WORKSPACE/target"
      - name: Build Arch package
        shell: bash
        run: |
          chmod 0755 "$RUNNER_TEMP/mihomo-seeds/mihomo-linux-x86_64"
          runuser -u builder -- env \
            MANIS_BUILD_COMMIT="$MANIS_BUILD_COMMIT" \
            MANIS_BUILD_VERSION="$MANIS_PACKAGE_VERSION" \
            MANIS_MIHOMO_BINARY="$RUNNER_TEMP/mihomo-seeds/mihomo-linux-x86_64" \
            MANIS_PACKAGE_VERSION="$MANIS_PACKAGE_VERSION" \
            bash -c \
            'cd "$1/packaging/archlinux" && makepkg --noconfirm --cleanbuild' \
            _ "$GITHUB_WORKSPACE"
          mkdir -p dist
          package_path="$(find packaging/archlinux -maxdepth 1 -type f -name 'manis-*.pkg.tar.zst' -print -quit)"
          [[ -n "$package_path" ]]
          package_name="$(basename "$package_path")"
          cp "$package_path" "dist/$package_name"
          (cd dist && sha256sum "$package_name" > "$package_name.sha256")
      - name: Save Cargo cache
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /home/builder/.cargo/registry/index/
            /home/builder/.cargo/registry/cache/
            /home/builder/.cargo/git/db/
            target/archlinux/
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - name: Inspect package metadata
        shell: bash
        run: |
          package_path="$(find dist -maxdepth 1 -type f -name 'manis-*.pkg.tar.zst' -print -quit)"
          pacman -Qip "$package_path"
          pacman -Qlp "$package_path"
          pacman -Qlp "$package_path" | grep -Fx 'manis /usr/lib/manis/manis-linux-helper'
          pacman -Qlp "$package_path" | grep -Fx 'manis /usr/share/polkit-1/actions/dev.manis.app.linux-helper.policy'
          bsdtar -xOf "$package_path" .INSTALL | grep -F '/usr/bin/setcap cap_net_admin,cap_net_raw=ep /usr/lib/manis/mihomo'
      - name: Upload Arch Linux package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manis-archlinux-wayland-x86_64
          path: |
            dist/manis-*.pkg.tar.zst
            dist/manis-*.pkg.tar.zst.sha256
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android arm64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MANIS_ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
      - name: Install Android SDK packages
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018"
      - name: Install Rust target
        run: rustup target add aarch64-linux-android
      - name: Install cargo-ndk
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-ndk
      - name: Build APK
        run: android/build-apk.sh arm64-v8a
      - name: Verify and name APK
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          aapt="${ANDROID_HOME}/build-tools/35.0.0/aapt"
          badging="$("$aapt" dump badging "$apk" | grep -E '^package:')"
          echo "$badging"
          [[ "$badging" == *"versionCode='${MANIS_ANDROID_VERSION_CODE}'"* ]]
          [[ "$badging" == *"versionName='${MANIS_PACKAGE_VERSION}-android'"* ]]
          "$aapt" dump badging "$apk" | grep -E "^sdkVersion:|^targetSdkVersion:|^native-code:"
          unzip -l "$apk" | grep -E "lib/arm64-v8a/(libmanis_android|libmihomo)\.so"
          mkdir -p dist
          asset="Manis-${MANIS_PACKAGE_VERSION}-android-arm64-debug.apk"
          cp "$apk" "dist/$asset"
          (cd dist && sha256sum "$asset" > "$asset.sha256" && sha256sum --check "$asset.sha256")
      - name: Upload Android APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manis-android-arm64
          path: |
            dist/Manis-*-android-arm64-debug.apk
            dist/Manis-*-android-arm64-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Update release
    if: github.event_name == 'push'
    needs:
      - macos
      - archlinux-wayland
      - android
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: manis-*
          path: dist/release
          merge-multiple: true
      - name: Verify release assets
        shell: bash
        run: |
          cd dist/release
          shopt -s nullglob
          macos_archives=(Manis-*-macos-*-unsigned.zip)
          linux_packages=(manis-*.pkg.tar.zst)
          android_apks=(Manis-*-android-arm64-debug.apk)
          checksums=(*.sha256)
          [[ ${#macos_archives[@]} -eq 2 ]]
          [[ ${#linux_packages[@]} -eq 1 ]]
          [[ ${#android_apks[@]} -eq 1 ]]
          [[ ${#checksums[@]} -eq 4 ]]
          sha256sum --check "${checksums[@]}"
      - name: Create signed-by-release update manifest
        shell: bash
        run: packaging/generate-update-manifest.sh dist/release
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          notes_file="$(mktemp)"
          trap 'rm -f "$notes_file"' EXIT
          create_target=()
          edit_target=()
          create_state=()
          edit_state=()
          rolling_release=0
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            release_tag="$GITHUB_REF_NAME"
            release_title="Manis $release_tag test build"
            create_target=(--verify-tag)
            create_state=(--draft --prerelease)
            edit_state=(--draft --prerelease)
            cat > "$notes_file" <<'EOF'
          Automated test packages for macOS, Arch Linux, and Android.

          The macOS archives are ad-hoc signed and not notarized, so Gatekeeper still warns on
          first open. Normal proxy mode can be tested. TUN is available after administrator
          authorization without a paid Apple Developer Program account, and every changed Manis app
          version must be approved again because the helper pins the exact app, helper controller,
          privileged helper, and user ID.
          The Android APK is an experimental arm64 `debug` build signed with the repository debug
          key; install it by sideloading after allowing installs from the downloading app.
          This release remains a draft until the maintainer release checklist is complete.
          EOF
          else
            rolling_release=1
            release_tag="latest"
            release_title="Latest Manis development build ($MANIS_PACKAGE_VERSION · ${GITHUB_SHA::7})"
            create_target=(--target "$GITHUB_SHA")
            edit_target=(--target "$GITHUB_SHA")
            create_state=(--prerelease --latest=false)
            edit_state=(--draft=false --prerelease=true --latest=false)
            {
              echo 'Automated test packages from the latest successful build of `main`.'
              echo
              printf 'Version: `%s`\n' "$MANIS_PACKAGE_VERSION"
              echo
              printf 'Commit: `%s`\n' "$GITHUB_SHA"
              echo
              echo 'The macOS archives are ad-hoc signed and not notarized, so Gatekeeper still warns'
              echo 'on first open. Normal proxy mode can be tested. TUN is available after administrator'
              echo 'authorization without a paid Apple Developer Program account, and every changed'
              echo 'Manis app version must be approved again because the helper pins the exact app,'
              echo 'helper controller, privileged helper, and user ID.'
              echo 'The Arch Linux package is experimental and supports native Wayland.'
              echo 'The Android package is an arm64 `debug` APK signed with the repository debug key.'
              echo 'It installs over earlier debug builds made with the same key; enable installation'
              echo 'from unknown sources for the app you download it with.'
              echo
              echo 'This rolling pre-release is replaced after every successful `main` build. Verify the'
              echo 'download with its accompanying `.sha256` file before installing it.'
            } > "$notes_file"
          fi

          release_assets=(dist/release/*)
          if is_draft="$(
            gh release view "$release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft \
              --jq .isDraft 2>/dev/null
          )"; then
            if [[ "$rolling_release" == "0" && "$is_draft" != "true" ]]; then
              echo "release $release_tag is already published; refusing to replace its assets" >&2
              exit 1
            fi
            gh release upload "$release_tag" "${release_assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            mapfile -t published_assets < <(
              gh release view "$release_tag" \
                --repo "$GITHUB_REPOSITORY" \
                --json assets \
                --jq '.assets[].name'
            )
            for published_asset in "${published_assets[@]}"; do
              keep_asset=0
              for local_asset in "${release_assets[@]}"; do
                if [[ "$(basename "$local_asset")" == "$published_asset" ]]; then
                  keep_asset=1
                  break
                fi
              done
              if [[ "$keep_asset" == "0" ]]; then
                gh release delete-asset "$release_tag" "$published_asset" \
                  --repo "$GITHUB_REPOSITORY" \
                  --yes
              fi
            done
            if [[ "$rolling_release" == "1" && "$is_draft" != "true" ]]; then
              gh api --method PATCH \
                "repos/$GITHUB_REPOSITORY/git/refs/tags/$release_tag" \
                -f sha="$GITHUB_SHA" \
                -F force=true \
                >/dev/null
            fi
            gh release edit "$release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              "${edit_target[@]}" \
              "${edit_state[@]}" \
              --title "$release_title" \
              --notes-file "$notes_file"
          else
            gh release create "$release_tag" "${release_assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              "${create_target[@]}" \
              "${create_state[@]}" \
              --title "$release_title" \
              --notes-file "$notes_file"
          fi

          if [[ "$rolling_release" == "1" ]]; then
            immutable_tag="build-$MANIS_PACKAGE_VERSION"
            if immutable_target="$(
              gh release view "$immutable_tag" \
                --repo "$GITHUB_REPOSITORY" \
                --json targetCommitish \
                --jq .targetCommitish 2>/dev/null
            )"; then
              if [[ "$immutable_target" != "$GITHUB_SHA" ]]; then
                echo "release $immutable_tag already targets another commit" >&2
                exit 1
              fi
            else
              gh release create "$immutable_tag" "${release_assets[@]}" \
                --repo "$GITHUB_REPOSITORY" \
                --target "$GITHUB_SHA" \
                --prerelease \
                --latest=false \
                --title "Manis $MANIS_PACKAGE_VERSION development build" \
                --notes "Immutable development packages for AUR and reproducible installs. Commit: $GITHUB_SHA"
            fi
          fi
