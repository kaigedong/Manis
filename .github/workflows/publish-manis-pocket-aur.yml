name: Publish Manis Pocket AUR

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Manis-Pocket master commit to publish (40-character SHA)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-manis-pocket-aur
  cancel-in-progress: false

jobs:
  publish:
    name: Update manis-pocket-wayland-git
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Validate requested source commit
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'source_sha must be a full commit SHA' >&2
            exit 1
          fi
          remote_head="$(git ls-remote https://github.com/kaigedong/Manis-Pocket.git refs/heads/master | cut -f1)"
          if [[ "$SOURCE_SHA" != "$remote_head" ]]; then
            echo "source_sha is not the current Manis-Pocket master commit" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kaigedong/Manis-Pocket
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure AUR SSH identity
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          if [[ -z "$AUR_SSH_PRIVATE_KEY" ]]; then
            echo 'AUR_SSH_PRIVATE_KEY is not configured' >&2
            exit 1
          fi
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$HOME/.ssh/aur"
          chmod 0600 "$HOME/.ssh/aur"
          printf '%s\n' \
            'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' \
            > "$HOME/.ssh/known_hosts"
          chmod 0644 "$HOME/.ssh/known_hosts"

      - name: Prepare AUR metadata
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/aur -o IdentitiesOnly=yes
        shell: bash
        run: |
          aur_dir="$RUNNER_TEMP/manis-pocket-wayland-git"
          git clone ssh://aur@aur.archlinux.org/manis-pocket-wayland-git.git "$aur_dir"
          cp packaging/aur/PKGBUILD "$aur_dir/PKGBUILD"

          base_version="$(awk -F '"' '/^version = / { print $2; exit }' crates/manis-pocket-wayland/Cargo.toml)"
          if [[ ! "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'invalid Wayland client version' >&2
            exit 1
          fi
          pkgver="$base_version.r$(git rev-list --count HEAD).g$(git rev-parse --short=7 HEAD)"
          sed -i "s/^pkgver=.*/pkgver=$pkgver/" "$aur_dir/PKGBUILD"

          docker run --rm \
            --platform linux/amd64 \
            -v "$aur_dir:/aur:ro" \
            archlinux:base-devel@sha256:a26046b7363dad8e2614858f4313949ae9b05c9c5f31de343a54864b9e20806f \
            bash -lc '
              useradd --create-home builder
              cp -a /aur /home/builder/package
              chown -R builder:builder /home/builder/package
              runuser -u builder -- bash -lc "cd ~/package && makepkg --printsrcinfo"
            ' > "$aur_dir/.SRCINFO"
          grep -Fx "$(printf '\tpkgver = %s' "$pkgver")" "$aur_dir/.SRCINFO"

      - name: Publish AUR package
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/aur -o IdentitiesOnly=yes
        shell: bash
        run: |
          cd "$RUNNER_TEMP/manis-pocket-wayland-git"
          git config user.name 'Manis Pocket release automation'
          git config user.email 'bobosingle@users.noreply.github.com'
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo 'AUR package is already current'
            exit 0
          fi
          git commit -m "Update to $(sed -n 's/^pkgver=//p' PKGBUILD)"
          git push origin HEAD:master
