name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CI reuses complete dependency artifacts, not local incremental sessions.
  CARGO_INCREMENTAL: "0"
  # Keep file/line backtraces without generating full debugger type information.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  quality:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    name: Format, lint, and test (macOS)
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test macOS helper signatures and authorization boundaries
        run: bash packaging/macos/test-helper-security.sh
      - name: Restore Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          # Keep CI artifacts separate from release builds and incompatible toolchains.
          key: cargo-ci-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.github/workflows/ci.yml') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            cargo-ci-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.github/workflows/ci.yml') }}-
      - name: Run tests
        # Keep successful runs readable while preserving libtest's failure details.
        run: cargo test --workspace --all-targets --locked --quiet
      - name: Check and lint all targets
        # Clippy also type-checks every target, so a separate cargo check is redundant.
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Check snapshot fixture harness
        run: cargo check -p manis-ui --example snapshot --features snapshot-fixtures --locked
      - name: Save Cargo cache
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  platform-check:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    name: Check ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          dbus libasound2-dev libfontconfig1-dev libwayland-dev
          libx11-xcb-dev libxcb-render0-dev libxcb-shape0-dev
          libxcb-xfixes0-dev libxkbcommon-dev
      - name: Install Rust toolchain
        run: rustup show active-toolchain
      - name: Restore Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: cargo-ci-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.github/workflows/ci.yml') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            cargo-ci-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.github/workflows/ci.yml') }}-
      - name: Check workspace
        run: cargo check --workspace --all-targets --locked
      - name: Test restricted controller transports
        run: cargo test -p manis-mihomo --all-targets --locked --quiet
      - name: Test Linux profile rendering
        if: runner.os == 'Linux'
        run: cargo test -p manis-profile --locked --quiet
      - name: Test Linux TUN DNS lifecycle
        if: runner.os == 'Linux'
        run: cargo test -p manis-ui --lib linux_tun_dns --locked --quiet
      - name: Test GTK-free Linux tray
        if: runner.os == 'Linux'
        run: cargo test -p manis-ui --lib linux_tray --locked --quiet
      - name: Test Linux tray on an isolated D-Bus session
        if: runner.os == 'Linux'
        run: dbus-run-session -- cargo test -p manis-ui --lib linux_tray_dbus --locked --quiet -- --ignored
      - name: Test Linux structured diagnostics
        if: runner.os == 'Linux'
        run: cargo test -p manis-ui --lib diagnostics::tests --locked --quiet
      - name: Test Linux privileged helper boundary
        if: runner.os == 'Linux'
        run: cargo test -p manis-linux-helper --locked --quiet
      - name: Save Cargo cache
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
