[workspace]
members = [
    "crates/relay-core",
    "crates/relay-engine",
    "crates/relay-mihomo",
    "crates/relay-ui",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
