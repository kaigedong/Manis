[workspace]
members = [
    "crates/manis-core",
    "crates/manis-engine",
    "crates/manis-linux-helper",
    "crates/manis-mihomo",
    "crates/manis-profile",
    "crates/manis-ui",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
homepage = "https://github.com/kaigedong/Manis"
publish = false
readme = "README.md"
repository = "https://github.com/kaigedong/Manis"
rust-version = "1.98"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
