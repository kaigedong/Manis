[package]
name = "manis-service"
description = "Platform-neutral Manis desktop domain layer and headless engine"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
publish = false
readme.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "manis-engine"
path = "src/bin/manis-engine.rs"

[dependencies]
manis-core = { path = "../manis-core" }
manis-engine = { path = "../manis-engine" }
manis-mihomo = { path = "../manis-mihomo" }
manis-presentation = { path = "../manis-presentation" }
manis-profile = { path = "../manis-profile" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
hex = "0.4.3"
toml_edit = "0.25.17"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry"] }
ureq = { version = "=3.5.0", default-features = false, features = ["rustls"] }

[lints]
workspace = true
