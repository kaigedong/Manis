[package]
name = "manis-ui"
description = "Cross-platform GPUI desktop application for policy-based proxy routing"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
publish.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
snapshot-fixtures = []

[[example]]
name = "snapshot"
required-features = ["snapshot-fixtures"]

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.7", default-features = false }
gpui-component = "0.7.0"
gpui-component-assets = { package = "gpui-kit-assets", version = "0.7.0" }
manis-core = { path = "../manis-core" }
manis-engine = { path = "../manis-engine" }
manis-mihomo = { path = "../manis-mihomo" }
manis-profile = { path = "../manis-profile" }
# Already in the dependency graph via gpui; declaring it here adds no build cost.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
flate2 = "1.1.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
hex = "0.4"
toml_edit = "0.25.15"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry"] }
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.7", features = ["font-kit"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.7", features = ["wayland", "x11"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "=0.3.6", default-features = false, features = ["async-io", "blocking"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
# Keep GTK and libxdo out of the lockfile, including their optional Linux dependencies.
tray-icon = { version = "=0.25.1", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.7" }

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.7", default-features = false, features = ["test-support"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.7", features = ["font-kit", "test-support"] }

[lints]
workspace = true
