[package]
name = "manis-ui"
description = "Cross-platform GPUI desktop application for policy-based proxy routing"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
publish.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
snapshot-fixtures = []

[[example]]
name = "snapshot"
required-features = ["snapshot-fixtures"]

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", package = "gpui", default-features = false }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "aa7def675aa17b31ca7b79542c8e7a779ed3e56b" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "aa7def675aa17b31ca7b79542c8e7a779ed3e56b" }
manis-core = { path = "../manis-core" }
manis-engine = { path = "../manis-engine" }
manis-mihomo = { path = "../manis-mihomo" }
manis-profile = { path = "../manis-profile" }
# Already in the dependency graph via gpui; declaring it here adds no build cost.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
flate2 = "1.1.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
ureq = { version = "=3.4.0", default-features = false, features = ["rustls"] }
zip = { version = "3.0.0", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", package = "gpui_platform", features = ["font-kit"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", package = "gpui_platform", features = ["wayland", "x11"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "=0.3.6", default-features = false, features = ["async-io", "blocking"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
# Keep GTK and libxdo out of the lockfile, including their optional Linux dependencies.
tray-icon = { version = "=0.24.2", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", package = "gpui_platform" }

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", package = "gpui", default-features = false, features = ["test-support"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", package = "gpui_platform", features = ["font-kit", "test-support"] }

[lints]
workspace = true
